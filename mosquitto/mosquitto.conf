# Configuration Mosquitto pour le jeu (réseau local uniquement, sans Internet)
# Lancer depuis la racine du projet :  mosquitto -c mosquitto/mosquitto.conf -v
#
# Sans ce fichier, Mosquitto 2.x n'accepte que les connexions de localhost :
# la carte Arduino (qui se connecte par Wi-Fi) serait refusée.
listener 1883 0.0.0.0
allow_anonymous true
