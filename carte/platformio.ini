; Firmware du jeu : pio run -e mkrwifi1010 -t upload
[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/WiFiNINA@^1.8.14
    knolleary/PubSubClient@^2.8
    seeed-studio/Grove - LCD RGB Backlight
    seeed-studio/Grove LED Bar
    arduino-libraries/Servo
; Options (décommenter, une par ligne sous build_flags) :
;   -DBARRE_FILS_INVERSES    si la barre de LED reste éteinte (fils A5/A6 inversés)
;   -DBUZZER_VOLUME=20       volume du buzzer, de 1 (très bas) à 50 (plein volume), 8 par défaut
; build_flags =
;     -DBUZZER_VOLUME=20

; Test du câblage (LED, buzzer, barre de LED, servo, écran, 6 boutons) :
;   pio run -e cablage -t upload
[env:cablage]
extends = env:mkrwifi1010
build_src_filter = -<*> +<../test_cablage/>
